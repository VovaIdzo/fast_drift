name: fast_drift_gen
version: 1.5.0
description: Automatically generating `Companion` and `Table` classes with `@DriftGen()` annotation.

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  analyzer: ">=8.4.1 <15.0.0"
  build: ">=4.0.3 <5.0.0"
  source_gen: ">=4.1.1 <5.0.0"
  drift: ">=2.28.1 <3.0.0"
  fast_drift:
  #  path: ../fast_drift
    git:
      url: https://github.com/VovaIdzo/fast_drift
      path: fast_drift
  meta: ^1.17.0

dev_dependencies:
  flutter_lints: ^6.0.0
  build_runner: ">=1.11.5 <3.0.0"
